<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TONUS – Praxis für Sport- & Medizinische Massage</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#14302e',
            sage: { 50:'#f3f7f6',100:'#e2ecea',200:'#c5d9d5',300:'#9dbfb8',400:'#6f9e96',500:'#4f8279',600:'#3d6962',700:'#325550',800:'#2a4642',900:'#1f3532' },
            sand: { 50:'#fbf9f5',100:'#f4efe6',200:'#e8dfcf',300:'#d6c6aa' },
            coral:{ 100:'#fde4dc',400:'#f08a6c',500:'#e5694a',600:'#c9502f' }
          },
          fontFamily: {
            sans: ['Inter','system-ui','sans-serif'],
            display: ['Fraunces','Georgia','serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { -webkit-font-smoothing: antialiased; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    input[type=range] { accent-color: #e5694a; }
    .chip-active { background:#325550 !important; color:#fff !important; border-color:#325550 !important; }
    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }
    .dot { animation: blink 1.2s infinite both; }
    .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
    @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  </style>
</head>

<body class="bg-sand-50 text-ink font-sans">

  <!-- ============ DEMO BANNER ============ -->
  <div class="bg-ink text-sand-100 text-xs text-center py-2 px-4" data-i18n="banner"></div>

  <!-- ============ HEADER ============ -->
  <header class="sticky top-0 z-40 bg-sand-50/85 backdrop-blur border-b border-sand-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="#top" class="flex items-center gap-2.5 shrink-0">
        <span class="w-9 h-9 rounded-xl bg-sage-700 text-white grid place-items-center font-display text-lg">T</span>
        <span class="leading-tight">
          <span class="block font-display text-lg font-semibold tracking-wide">TONUS</span>
          <span class="block text-[11px] text-sage-600 -mt-0.5" data-i18n="brand_sub"></span>
        </span>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-sage-800">
        <a href="#leistungen" class="hover:text-coral-500" data-i18n="nav_services"></a>
        <a href="#buchung" class="hover:text-coral-500" data-i18n="nav_booking"></a>
        <a href="#dashboard" class="hover:text-coral-500" data-i18n="nav_dashboard"></a>
        <a href="#kontakt" class="hover:text-coral-500" data-i18n="nav_contact"></a>
      </nav>
      <div class="flex items-center gap-3">
        <div class="flex rounded-full border border-sage-200 bg-white p-0.5 text-xs font-semibold" role="group" aria-label="Sprache">
          <button data-lang="de" class="lang-btn px-2.5 py-1 rounded-full">DE</button>
          <button data-lang="en" class="lang-btn px-2.5 py-1 rounded-full">EN</button>
        </div>
        <a href="#buchung" class="hidden sm:inline-flex bg-coral-500 hover:bg-coral-600 text-white text-sm font-semibold px-4 py-2 rounded-full transition" data-i18n="cta_book"></a>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 pt-14 pb-16 grid lg:grid-cols-2 gap-12 items-center">
      <div>
        <span class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-sage-700 bg-sage-100 px-3 py-1.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-coral-500"></span><span data-i18n="hero_badge"></span>
        </span>
        <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-semibold leading-[1.05] mt-5" data-i18n="hero_title"></h1>
        <p class="mt-5 text-lg text-sage-800/80 max-w-lg" data-i18n="hero_sub"></p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a href="#buchung" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold px-6 py-3 rounded-full transition" data-i18n="hero_cta1"></a>
          <a href="#leistungen" class="bg-white border border-sage-200 hover:border-sage-400 font-semibold px-6 py-3 rounded-full transition" data-i18n="hero_cta2"></a>
        </div>
        <div class="mt-8 flex items-center gap-3 text-sm text-sage-700">
          <span class="text-coral-500 tracking-tight">★★★★★</span>
          <span data-i18n="hero_rating"></span>
        </div>
      </div>

      <!-- Hero visual -->
      <div class="relative">
        <div class="aspect-[4/3.4] rounded-[2rem] bg-gradient-to-br from-sage-600 via-sage-700 to-ink overflow-hidden relative shadow-xl">
          <div class="absolute -top-16 -right-16 w-72 h-72 rounded-full bg-sage-400/30"></div>
          <div class="absolute bottom-0 -left-10 w-64 h-64 rounded-full bg-coral-400/20"></div>
          <svg viewBox="0 0 200 200" class="absolute inset-0 m-auto w-2/3 opacity-90" aria-hidden="true">
            <circle cx="100" cy="40" r="18" fill="#f4efe6"/>
            <path d="M62 70 Q100 56 138 70 L130 150 Q100 162 70 150 Z" fill="#f4efe6"/>
            <path d="M100 66 L100 150" stroke="#9dbfb8" stroke-width="2" stroke-dasharray="3 5"/>
            <circle cx="100" cy="128" r="16" fill="#f08a6c" opacity=".55"/>
            <circle cx="78" cy="78" r="11" fill="#f08a6c" opacity=".45"/>
            <circle cx="122" cy="78" r="11" fill="#f08a6c" opacity=".45"/>
          </svg>
        </div>
        <!-- Floating: next slot -->
        <div class="absolute -bottom-6 -left-4 sm:left-6 bg-white rounded-2xl shadow-lg p-4 w-60 border border-sand-200">
          <p class="text-xs text-sage-600 font-medium" data-i18n="hero_next"></p>
          <p id="heroNext" class="font-semibold mt-1"></p>
          <a href="#buchung" class="mt-3 inline-flex text-xs font-semibold text-coral-500 hover:underline" data-i18n="hero_next_cta"></a>
        </div>
        <!-- Floating: quote -->
        <div class="hidden sm:block absolute -top-5 -right-3 bg-white rounded-2xl shadow-lg p-4 w-56 border border-sand-200">
          <p class="text-sm leading-snug" data-i18n="hero_quote"></p>
          <p class="text-xs text-sage-600 mt-2">— Julia B., Augsburg</p>
        </div>
      </div>
    </section>

    <!-- Trust strip -->
    <section class="border-y border-sand-200 bg-white">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-2 md:grid-cols-4 gap-6 text-sm">
        <div class="flex items-start gap-3"><span class="text-xl">🎓</span><span data-i18n="trust1"></span></div>
        <div class="flex items-start gap-3"><span class="text-xl">🩺</span><span data-i18n="trust2"></span></div>
        <div class="flex items-start gap-3"><span class="text-xl">📱</span><span data-i18n="trust3"></span></div>
        <div class="flex items-start gap-3"><span class="text-xl">🅿️</span><span data-i18n="trust4"></span></div>
      </div>
    </section>

    <!-- ============ SERVICES ============ -->
    <section id="leistungen" class="max-w-6xl mx-auto px-4 sm:px-6 py-20">
      <div class="max-w-2xl">
        <p class="text-sm font-semibold uppercase tracking-wider text-coral-500" data-i18n="svc_kicker"></p>
        <h2 class="font-display text-3xl sm:text-4xl font-semibold mt-2" data-i18n="svc_title"></h2>
        <p class="mt-3 text-sage-800/80" data-i18n="svc_sub"></p>
      </div>
      <div id="serviceGrid" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <div class="mt-8 grid md:grid-cols-3 gap-5">
        <div class="md:col-span-2 rounded-2xl bg-sage-100 p-6">
          <h3 class="font-semibold flex items-center gap-2">🧾 <span data-i18n="ins_title"></span></h3>
          <p class="text-sm mt-2 text-sage-900/80 leading-relaxed" data-i18n="ins_text"></p>
        </div>
        <div class="rounded-2xl bg-sand-100 p-6">
          <h3 class="font-semibold" data-i18n="card_title"></h3>
          <p class="text-sm mt-2 text-sage-900/80" data-i18n="card_text"></p>
        </div>
      </div>
    </section>

    <!-- ============ BOOKING ============ -->
    <section id="buchung" class="bg-white border-y border-sand-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-20">
        <div class="max-w-2xl">
          <p class="text-sm font-semibold uppercase tracking-wider text-coral-500" data-i18n="book_kicker"></p>
          <h2 class="font-display text-3xl sm:text-4xl font-semibold mt-2" data-i18n="book_title"></h2>
          <p class="mt-3 text-sage-800/80" data-i18n="book_sub"></p>
        </div>

        <div class="mt-10 grid lg:grid-cols-3 gap-8 items-start">
          <form id="bookingForm" class="lg:col-span-2 space-y-8" novalidate>

            <!-- Step 1: Symptoms -->
            <fieldset class="rounded-2xl border border-sand-200 p-5 sm:p-6">
              <legend class="px-2 font-semibold flex items-center gap-2"><span class="step-no">1</span><span data-i18n="step1"></span></legend>
              <p class="text-xs text-sage-600 mb-3" data-i18n="step1_hint"></p>
              <div id="symptomChips" class="flex flex-wrap gap-2"></div>
              <div class="mt-6">
                <div class="flex justify-between text-sm font-medium">
                  <label for="pain" data-i18n="pain_label"></label>
                  <span><span id="painVal" class="font-semibold text-coral-500">5</span> / 10</span>
                </div>
                <input id="pain" type="range" min="0" max="10" value="5" class="w-full mt-2" />
                <div class="flex justify-between text-xs text-sage-600"><span data-i18n="pain_none"></span><span data-i18n="pain_max"></span></div>
              </div>
              <div id="recBox" class="hidden mt-5 rounded-xl bg-coral-100/60 border border-coral-400/30 p-4 text-sm fade-in"></div>
            </fieldset>

            <!-- Step 2: Service -->
            <fieldset class="rounded-2xl border border-sand-200 p-5 sm:p-6">
              <legend class="px-2 font-semibold flex items-center gap-2"><span class="step-no">2</span><span data-i18n="step2"></span></legend>
              <div id="serviceOptions" class="grid sm:grid-cols-2 gap-3"></div>
            </fieldset>

            <!-- Step 3: Therapist -->
            <fieldset class="rounded-2xl border border-sand-200 p-5 sm:p-6">
              <legend class="px-2 font-semibold flex items-center gap-2"><span class="step-no">3</span><span data-i18n="step3"></span></legend>
              <div id="therapistToggle" class="inline-flex rounded-full bg-sand-100 p-1 text-sm font-medium"></div>
              <p class="text-xs text-sage-600 mt-3" data-i18n="step3_hint"></p>
            </fieldset>

            <!-- Step 4: Date & time -->
            <fieldset class="rounded-2xl border border-sand-200 p-5 sm:p-6">
              <legend class="px-2 font-semibold flex items-center gap-2"><span class="step-no">4</span><span data-i18n="step4"></span></legend>
              <div id="dateStrip" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
              <div id="slotGrid" class="mt-4 grid grid-cols-3 sm:grid-cols-5 gap-2"></div>
            </fieldset>

            <!-- Step 5: Personal + health -->
            <fieldset class="rounded-2xl border border-sand-200 p-5 sm:p-6">
              <legend class="px-2 font-semibold flex items-center gap-2"><span class="step-no">5</span><span data-i18n="step5"></span></legend>
              <div class="grid sm:grid-cols-2 gap-3">
                <input id="fName" class="field" data-i18n-ph="f_name" autocomplete="name" />
                <input id="fPhone" class="field" data-i18n-ph="f_phone" type="tel" autocomplete="tel" />
                <input id="fEmail" class="field sm:col-span-2" data-i18n-ph="f_email" type="email" autocomplete="email" />
                <textarea id="fNotes" rows="3" class="field sm:col-span-2" data-i18n-ph="f_notes"></textarea>
              </div>
              <div class="mt-5 rounded-xl bg-sand-50 border border-sand-200 p-4">
                <p class="text-sm font-semibold mb-3" data-i18n="health_title"></p>
                <div class="grid sm:grid-cols-2 gap-2 text-sm">
                  <label class="flex items-center gap-2"><input type="checkbox" id="hPreg" class="accent-sage-700 w-4 h-4"><span data-i18n="h_preg"></span></label>
                  <label class="flex items-center gap-2"><input type="checkbox" id="hBlood" class="accent-sage-700 w-4 h-4"><span data-i18n="h_blood"></span></label>
                  <label class="flex items-center gap-2"><input type="checkbox" id="hAcute" class="accent-sage-700 w-4 h-4"><span data-i18n="h_acute"></span></label>
                  <label class="flex items-center gap-2"><input type="checkbox" id="hRx" class="accent-sage-700 w-4 h-4"><span data-i18n="h_rx"></span></label>
                </div>
              </div>
              <label class="mt-4 flex items-start gap-2 text-xs text-sage-700">
                <input type="checkbox" id="consent" class="accent-sage-700 w-4 h-4 mt-0.5 shrink-0"><span data-i18n="consent"></span>
              </label>
            </fieldset>
          </form>

          <!-- Summary -->
          <aside class="lg:sticky lg:top-24 rounded-2xl bg-ink text-sand-50 p-6 shadow-xl">
            <h3 class="font-display text-xl font-semibold" data-i18n="sum_title"></h3>
            <dl class="mt-5 space-y-3 text-sm">
              <div class="flex justify-between gap-4"><dt class="text-sage-300" data-i18n="sum_service"></dt><dd id="sumService" class="text-right font-medium"></dd></div>
              <div class="flex justify-between gap-4"><dt class="text-sage-300" data-i18n="sum_therapist"></dt><dd id="sumTherapist" class="text-right font-medium"></dd></div>
              <div class="flex justify-between gap-4"><dt class="text-sage-300" data-i18n="sum_date"></dt><dd id="sumDate" class="text-right font-medium"></dd></div>
              <div class="flex justify-between gap-4"><dt class="text-sage-300" data-i18n="sum_symptoms"></dt><dd id="sumSymptoms" class="text-right font-medium"></dd></div>
              <div class="border-t border-white/15 pt-3 flex justify-between gap-4 text-base"><dt data-i18n="sum_price"></dt><dd id="sumPrice" class="font-semibold"></dd></div>
            </dl>
            <p id="formError" class="hidden mt-4 text-xs bg-coral-500/20 border border-coral-400/40 text-coral-100 rounded-lg p-3"></p>
            <button id="submitBtn" type="button" class="mt-6 w-full bg-coral-500 hover:bg-coral-600 transition text-white font-semibold py-3 rounded-full" data-i18n="submit"></button>
            <p class="mt-3 text-xs text-sage-300 text-center" data-i18n="sum_note"></p>
          </aside>
        </div>
      </div>
    </section>

    <!-- ============ OWNER DASHBOARD ============ -->
    <section id="dashboard" class="max-w-6xl mx-auto px-4 sm:px-6 py-20">
      <div class="grid lg:grid-cols-3 gap-8 items-end">
        <div class="lg:col-span-2">
          <p class="text-sm font-semibold uppercase tracking-wider text-coral-500" data-i18n="dash_kicker"></p>
          <h2 class="font-display text-3xl sm:text-4xl font-semibold mt-2" data-i18n="dash_title"></h2>
          <p class="mt-3 text-sage-800/80" data-i18n="dash_sub"></p>
        </div>
        <ul class="space-y-2 text-sm">
          <li class="flex gap-2"><span class="text-sage-600">✓</span><span data-i18n="dash_feat1"></span></li>
          <li class="flex gap-2"><span class="text-sage-600">✓</span><span data-i18n="dash_feat2"></span></li>
          <li class="flex gap-2"><span class="text-sage-600">✓</span><span data-i18n="dash_feat3"></span></li>
        </ul>
      </div>

      <!-- Tablet frame -->
      <div class="mt-10 rounded-[2.2rem] bg-ink p-2.5 sm:p-3.5 shadow-2xl">
        <div class="rounded-[1.6rem] bg-sand-50 overflow-hidden">
          <!-- App bar -->
          <div class="flex items-center justify-between px-5 py-3 bg-white border-b border-sand-200">
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 rounded-lg bg-sage-700 text-white grid place-items-center font-display text-sm">T</span>
              <span class="font-semibold text-sm" data-i18n="dash_app"></span>
            </div>
            <div class="flex items-center gap-3 text-xs text-sage-600">
              <span id="dashDate"></span>
              <span class="w-7 h-7 rounded-full bg-coral-100 text-coral-600 grid place-items-center font-semibold">MS</span>
            </div>
          </div>
          <!-- Stats -->
          <div id="dashStats" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-4 sm:p-5"></div>
          <!-- List + detail -->
          <div class="grid md:grid-cols-5 gap-4 px-4 sm:px-5 pb-5">
            <div class="md:col-span-2 rounded-2xl bg-white border border-sand-200 overflow-hidden">
              <div class="px-4 py-3 border-b border-sand-200 text-sm font-semibold" data-i18n="dash_list"></div>
              <ul id="dashList" class="divide-y divide-sand-200 max-h-[26rem] overflow-y-auto"></ul>
            </div>
            <div id="dashDetail" class="md:col-span-3 rounded-2xl bg-white border border-sand-200 p-5"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section id="kontakt" class="bg-sage-800 text-sand-50">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-16 grid md:grid-cols-3 gap-10">
        <div>
          <h2 class="font-display text-3xl font-semibold" data-i18n="contact_title"></h2>
          <p class="mt-3 text-sage-200 text-sm" data-i18n="contact_sub"></p>
        </div>
        <div class="text-sm space-y-1.5">
          <p class="font-semibold mb-2" data-i18n="contact_addr"></p>
          <p>TONUS Praxis</p>
          <p>Musterstraße 12</p>
          <p>86150 Augsburg</p>
          <p class="pt-2">☎ 0821 000 000 00</p>
          <p>✉ hallo@tonus-praxis.example</p>
        </div>
        <div class="text-sm">
          <p class="font-semibold mb-2" data-i18n="contact_hours"></p>
          <div class="grid grid-cols-2 gap-y-1.5 max-w-xs">
            <span data-i18n="h_weekdays"></span><span>8:00 – 20:00</span>
            <span data-i18n="h_sat"></span><span>9:00 – 14:00</span>
            <span data-i18n="h_sun"></span><span data-i18n="h_closed"></span>
          </div>
        </div>
      </div>
      <div class="border-t border-white/10">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex flex-wrap justify-between gap-3 text-xs text-sage-300">
          <span>© 2026 TONUS · <span data-i18n="footer_demo"></span></span>
          <span class="space-x-4"><a href="#" class="hover:text-white">Impressum</a><a href="#" class="hover:text-white" data-i18n="footer_privacy"></a></span>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ CHAT WIDGET ============ -->
  <div id="chatPanel" class="hidden fixed bottom-24 right-4 sm:right-6 z-50 w-[22.5rem] max-w-[calc(100vw-2rem)] h-[34rem] max-h-[calc(100vh-8rem)] bg-white rounded-3xl shadow-2xl border border-sand-200 flex flex-col overflow-hidden fade-in">
    <div class="bg-sage-700 text-white px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="relative w-9 h-9 rounded-full bg-white/15 grid place-items-center">✦
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-green-400 ring-2 ring-sage-700"></span>
        </span>
        <div class="leading-tight">
          <p class="font-semibold text-sm" data-i18n="chat_title"></p>
          <p class="text-xs text-sage-200" data-i18n="chat_status"></p>
        </div>
      </div>
      <button id="chatClose" class="text-white/80 hover:text-white text-xl leading-none" aria-label="Close">×</button>
    </div>
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-sand-50"></div>
    <div id="chatChips" class="px-3 pt-3 flex flex-wrap gap-1.5 bg-white border-t border-sand-200"></div>
    <form id="chatForm" class="p-3 flex gap-2 bg-white">
      <input id="chatInput" class="flex-1 rounded-full border border-sand-200 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-300" data-i18n-ph="chat_ph" />
      <button class="w-10 h-10 rounded-full bg-coral-500 hover:bg-coral-600 text-white grid place-items-center" aria-label="Send">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
  </div>
  <button id="chatToggle" class="fixed bottom-5 right-4 sm:right-6 z-50 h-14 pl-4 pr-5 rounded-full bg-sage-700 hover:bg-sage-800 text-white shadow-xl flex items-center gap-2 font-semibold text-sm transition">
    <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    <span data-i18n="chat_btn"></span>
  </button>

  <!-- ============ CONFIRMATION MODAL ============ -->
  <div id="modal" class="hidden fixed inset-0 z-[60] bg-ink/60 backdrop-blur-sm grid place-items-center p-4">

const t = k => (I18N[state.lang][k] ?? I18N.de[k] ?? k);
const L = obj => obj[state.lang] ?? obj.de;
const locale = () => state.lang === 'de' ? 'de-DE' : 'en-GB';
const euro = n => new Intl.NumberFormat(locale(), {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(n);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const svc = id => SERVICES.find(s => s.id === id);

function dayLabel(dateStr, long = false) {
  const d = parseYmd(dateStr);
  const diff = Math.round((d - parseYmd(ymd(now))) / 864e5);
  if (diff === 0) return t('today');
  if (diff === 1) return t('tomorrow');
  return new Intl.DateTimeFormat(locale(), long
    ? {weekday:'long', day:'numeric', month:'long'}
    : {weekday:'short', day:'2-digit', month:'2-digit'}).format(d);
}

/* Opening-hour slots; availability is simulated deterministically per day + preference */
function slotsFor(dateStr, pref = state.therapist) {
  const d = parseYmd(dateStr), dow = d.getDay();
  if (dow === 0) return [];
  const base = dow === 6
    ? ['09:00','10:00','11:00','12:00','13:00']
    : ['08:00','09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00','18:00','19:00'];
  const isToday = dateStr === ymd(now);
  const nowMin = now.getHours() * 60 + now.getMinutes() + 30;
  return base.map(time => {
    const [h, m] = time.split(':').map(Number);
    let taken = hash(dateStr + time + pref) % 10 < (pref === 'male' ? 5 : 3);
    if (isToday && h * 60 + m <= nowMin) taken = true;
    if (state.bookings.some(b => b.date === dateStr && b.time === time && (pref === 'any' || b.gender === pref))) taken = true;
    return { time, taken };
  });
}

function bookableDays(n = 14) {
  const days = [];
  for (let i = 0; days.length < n && i < 30; i++) {
    const d = new Date(now); d.setDate(now.getDate() + i);
    if (d.getDay() !== 0) days.push(ymd(d));
  }
  return days;
}

function assignTherapist(pref, dateStr, time) {
  const pool = THERAPISTS.filter(th => pref === 'any' || th.gender === pref);
  return pool[hash(dateStr + time) % pool.length];
}

/* =========================================================
   3) RENDERING
   ========================================================= */
function applyI18n() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.className = 'lang-btn px-2.5 py-1 rounded-full ' + (b.dataset.lang === state.lang ? 'bg-sage-700 text-white' : 'text-sage-700'));
}

function renderServices() {
  $('#serviceGrid').innerHTML = SERVICES.map(s => `
    <article class="group rounded-2xl bg-white border border-sand-200 p-6 flex flex-col hover:shadow-lg hover:-translate-y-0.5 transition">
      <div class="flex items-start justify-between">
        <span class="w-11 h-11 rounded-xl bg-sage-100 grid place-items-center text-xl">${s.icon}</span>
        <span class="text-[11px] font-semibold uppercase tracking-wide text-sage-700 bg-sage-50 border border-sage-200 px-2 py-1 rounded-full">${esc(L(s.tag))}</span>
      </div>
      <h3 class="font-semibold text-lg mt-4">${esc(L(s.name))}</h3>
      <p class="text-sm text-sage-800/75 mt-2 flex-1">${esc(L(s.desc))}</p>

        <div><span class="text-2xl font-semibold">${euro(s.price)}</span><span class="text-sm text-sage-600"> · ${s.dur} ${t('min')}</span></div>
        <button data-pick="${s.id}" class="text-sm font-semibold text-coral-500 group-hover:underline">${t('svc_select')} →</button>
      </div>
    </article>`).join('');
}

function renderSymptoms() {
  $('#symptomChips').innerHTML = SYMPTOMS.map(s => `
    <button type="button" data-sym="${s.id}" class="px-3.5 py-2 rounded-full border text-sm transition
      ${state.symptoms.has(s.id) ? 'chip-active' : 'border-sand-300 bg-white hover:border-sage-400'}">${esc(L(s.label))}</button>`).join('');
  renderRecommendation();
}

function recommendedService() {
  if (!state.symptoms.size) return null;
  const score = {};
  SYMPTOMS.filter(s => state.symptoms.has(s.id)).forEach(s => score[s.rec] = (score[s.rec] || 0) + 1);
  return Object.entries(score).sort((a, b) => b[1] - a[1])[0][0];
}

function renderRecommendation() {
  const rec = recommendedService(), box = $('#recBox');
  if (!rec) { box.classList.add('hidden'); return; }
  const s = svc(rec);
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <p><span class="font-semibold">${t('rec_label')}</span> ${s.icon} ${esc(L(s.name))} (${s.dur} ${t('min')}, ${euro(s.price)})</p>
      ${state.service === rec ? '<span class="text-sage-700 font-semibold">✓</span>'
        : `<button type="button" data-pick="${rec}" class="text-xs font-semibold bg-coral-500 text-white px-3 py-1.5 rounded-full">${t('rec_apply')}</button>`}
    </div>`;
}

function renderServiceOptions() {
  $('#serviceOptions').innerHTML = SERVICES.map(s => {
    const active = state.service === s.id;
    return `

      <div class="flex justify-between gap-2">
        <span class="font-semibold text-sm">${s.icon} ${esc(L(s.name))}</span>

}

function renderTherapist() {
  $('#therapistToggle').innerHTML = ['any','female','male'].map(v => `
    <button type="button" data-th="${v}" class="px-4 py-2 rounded-full transition
      ${state.therapist === v ? 'bg-white shadow text-ink' : 'text-sage-700 hover:text-ink'}">${t('th_' + v)}</button>`).join('');
}

function renderDates() {
  const days = bookableDays();
  if (!state.date) state.date = days.find(d => slotsFor(d).some(s => !s.taken)) || days[0];
  $('#dateStrip').innerHTML = days.map(d => {
    const free = slotsFor(d).filter(s => !s.taken).length;
    const active = d === state.date;
    return `
    <button type="button" data-date="${d}" class="shrink-0 w-[5.5rem] rounded-xl border px-2 py-2.5 text-center transition
      ${active ? 'chip-active' : 'border-sand-200 bg-white hover:border-sage-300'} ${free ? '' : 'opacity-50'}">
      <span class="block text-xs font-semibold">${esc(dayLabel(d))}</span>
      <span class="block text-[11px] mt-0.5 ${active ? 'text-sage-100' : 'text-sage-600'}">${free} ${state.lang === 'de' ? 'frei' : 'free'}</span>
    </button>`;
  }).join('');
  renderSlots();
}

function renderSlots() {
  const slots = slotsFor(state.date);
  if (state.time && !slots.some(s => s.time === state.time && !s.taken)) state.time = null;
  if (!slots.some(s => !s.taken)) {
    $('#slotGrid').innerHTML = `<p class="col-span-full text-sm text-sage-600 bg-sand-50 rounded-xl p-4">${t('no_slots')}</p>`;
    return;
  }
  $('#slotGrid').innerHTML = slots.map(s => `
    <button type="button" ${s.taken ? 'disabled' : `data-time="${s.time}"`} class="py-2.5 rounded-xl border text-sm font-medium transition
      ${s.taken ? 'border-sand-200 text-sage-300 line-through cursor-not-allowed bg-sand-50'
        : state.time === s.time ? 'chip-active' : 'border-sand-200 bg-white hover:border-sage-400'}">${s.time}</button>`).join('');
}

function renderSummary() {
  const s = svc(state.service);
  $('#sumService').textContent = s ? `${L(s.name)} (${s.dur} ${t('min')})` : '–';
  $('#sumTherapist').textContent = t('th_' + state.therapist);
  $('#sumDate').textContent = state.time ? `${dayLabel(state.date, true)}, ${state.time}` : '–';
  $('#sumSymptoms').textContent = state.symptoms.size ? state.symptoms.size + '×' : '–';
  $('#sumPrice').textContent = s ? euro(s.price) : '–';
}

function updateHeroNext() {
  for (const d of bookableDays()) {
    const free = slotsFor(d, 'any').find(s => !s.taken);
    if (free) { $('#heroNext').textContent = `${dayLabel(d, true)}, ${free.time}`; return; }
  }
}

function renderAll() {
  applyI18n(); renderServices(); renderSymptoms(); renderServiceOptions(); renderTherapist();
  renderDates(); renderSummary(); updateHeroNext(); renderDashboard(); resetChat();
}

function renderDashboard() {
  const list = [...state.bookings].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const today = ymd(now);
  const todayCount = list.filter(b => b.date === today).length;
  const capacity = slotsFor(today, 'none').length * THERAPISTS.length || 1;
  const pending = list.filter(b => b.status === 'pending').length;
  const revenue = list.reduce((sum, b) => sum + svc(b.service).price, 0);

  $('#dashDate').textContent = new Intl.DateTimeFormat(locale(), {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(now);

  const stat = (label, value, accent = '') => `
    <div class="rounded-2xl bg-white border border-sand-200 p-4">
      <p class="text-xs text-sage-600">${label}</p>
      <p class="text-2xl font-semibold mt-1 ${accent}">${value}</p>
    </div>`;
  $('#dashStats').innerHTML =
    stat(t('st_appts'), list.length) +
    stat(t('st_load'), Math.min(100, Math.round(todayCount / capacity * 100 * 4)) + ' %') +
    stat(t('st_new'), pending, pending ? 'text-coral-500' : '') +
    stat(t('st_rev'), euro(revenue));

  $('#dashList').innerHTML = list.map(b => {
    const active = b.id === state.selectedBooking;
    return `
    <li>
      <button data-bk="${b.id}" class="w-full text-left px-4 py-3 flex gap-3 items-start transition ${active ? 'bg-sage-50' : 'hover:bg-sand-50'}">
        <div class="w-14 shrink-0 text-center">
          <p class="text-sm font-semibold">${b.time}</p>
          <p class="text-[10px] text-sage-600">${esc(dayLabel(b.date))}</p>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">${esc(b.name)}</p>
          <p class="text-xs text-sage-600 truncate">${esc(L(svc(b.service).name))} · ${esc(b.therapist.split(' ')[0])}</p>
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${b.status === 'pending' ? 'bg-coral-100 text-coral-600' : 'bg-sage-100 text-sage-700'}">${t('status_' + b.status)}</span>
          ${b.flags.length ? `<span class="text-[10px] text-coral-600">⚠ ${t('flag_warn')}</span>` : ''}
        </div>
      </button>
    </li>`;
  }).join('');

  const b = state.bookings.find(x => x.id === state.selectedBooking) || list[0];
  if (!b) { $('#dashDetail').innerHTML = ''; return; }
  const areas = [...new Set(b.symptoms.flatMap(id => SYMPTOMS.find(s => s.id === id)?.areas || []))];
  const painColor = b.pain >= 7 ? 'bg-coral-500' : b.pain >= 4 ? 'bg-amber-400' : 'bg-sage-500';

  $('#dashDetail').innerHTML = `
    <div class="flex items-start justify-between gap-3 flex-wrap">
      <div>
        <p class="text-xs uppercase tracking-wider text-sage-600 font-semibold">${t('dash_intake')}</p>
        <h3 class="text-xl font-semibold mt-1">${esc(b.name)}</h3>
        <p class="text-sm text-sage-700">${esc(L(svc(b.service).name))} · ${esc(dayLabel(b.date, true))}, ${b.time} · ${t('with')} ${esc(b.therapist)}</p>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${b.rx ? 'bg-sage-100 text-sage-700' : 'bg-sand-100 text-sage-800'}">${b.rx ? '📄 ' + t('dash_rx') : t('dash_selfpay')}</span>
    </div>

    <div class="mt-5 grid sm:grid-cols-[auto,1fr] gap-6 items-start">
      <div class="text-center">
        ${bodyMap(areas)}

          <div class="h-2 rounded-full bg-sand-100 mt-1.5 overflow-hidden"><div class="h-full ${painColor} rounded-full" style="width:${b.pain * 10}%"></div></div>
        </div>
        <div>
          <p class="text-sm font-medium mb-1.5">${t('dash_symptoms')}</p>
          <div class="flex flex-wrap gap-1.5">${b.symptoms.map(id => `<span class="text-xs bg-sage-50 border border-sage-200 px-2 py-1 rounded-full">${esc(L(SYMPTOMS.find(s => s.id === id).label))}</span>`).join('') || '—'}</div>

        <div>
          <p class="text-sm font-medium mb-1.5">${t('dash_flags')}</p>

          <p class="text-sm font-medium mb-1">${t('dash_notes')}</p>
          <p class="text-sm text-sage-800 bg-sand-50 rounded-lg p-3 italic">${esc(b.notes) || t('dash_nonotes')}</p>

    <div class="mt-5 pt-4 border-t border-sand-200 flex gap-2 flex-wrap">
      ${b.status === 'pending'
        ? `<button data-confirm="${b.id}" class="bg-sage-700 hover:bg-sage-800 text-white text-sm font-semibold px-4 py-2 rounded-full">${t('dash_confirm')}</button>`
        : `<span class="text-sm font-semibold text-sage-700 px-2 py-2">✓ ${t('status_confirmed')}</span>`}
      <button class="border border-sand-200 text-sm font-semibold px-4 py-2 rounded-full">☎ ${t('dash_call')}</button>
    </div>`;
}

/* =========================================================
   4) BOOKING LOGIC
   ========================================================= */
function pickService(id, scroll = false) {
  state.service = id;
  renderServiceOptions(); renderRecommendation(); renderSummary();
  if (scroll) document.getElementById('buchung').scrollIntoView({behavior:'smooth'});
}

function submitBooking() {
  const name = $('#fName').value.trim(), phone = $('#fPhone').value.trim(), email = $('#fEmail').value.trim();
  const missing = [];
  if (!state.service) missing.push(t('e_service'));
  if (!state.time) missing.push(t('e_slot'));
  if (!name) missing.push(t('e_name'));
  if (!phone && !email) missing.push(t('e_contact'));
  if (!$('#consent').checked) missing.push(t('e_consent'));

  const err = $('#formError');
  if (missing.length) {
    err.textContent = `${t('err_missing')} ${missing.join(', ')}`;
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');

  const th = assignTherapist(state.therapist, state.date, state.time);
  const booking = {
    id: Date.now(), name, phone, email, service: state.service, date: state.date, time: state.time,
    therapist: th.name, gender: th.gender, pain: state.pain, symptoms: [...state.symptoms],
    flags: [['preg','#hPreg'],['blood','#hBlood'],['acute','#hAcute']].filter(([, sel]) => $(sel).checked).map(([f]) => f),
    rx: $('#hRx').checked, notes: $('#fNotes').value.trim(), status: 'pending'
  };
  state.bookings.push(booking);
  state.selectedBooking = booking.id;

  const s = svc(booking.service);
  $('#modalBody').innerHTML = `
    <p><strong>${esc(L(s.name))}</strong> · ${s.dur} ${t('min')} · ${euro(s.price)}</p>
    <p>📅 ${esc(dayLabel(booking.date, true))}, ${booking.time}</p>
    <p>👤 ${esc(th.name)} (${esc(L(th.role))})</p>`;
  $('#modal').classList.remove('hidden');

  // reset the form for the next demo run
  state.time = null; state.symptoms.clear(); state.service = null; state.pain = 5;
  $('#bookingForm').reset(); $('#painVal').textContent = 5;
  renderSymptoms(); renderServiceOptions(); renderDates(); renderSummary(); updateHeroNext(); renderDashboard();
}

/* =========================================================
   5) CHAT WIDGET
   ========================================================= */
function addMsg(text, from = 'bot') {
  const wrap = document.createElement('div');
  wrap.className = `flex fade-in ${from === 'user' ? 'justify-end' : 'justify-start'}`;
  wrap.innerHTML = `<div class="max-w-[85%] text-sm leading-relaxed px-3.5 py-2.5 rounded-2xl ${from === 'user'
    ? 'bg-sage-700 text-white rounded-br-md' : 'bg-white border border-sand-200 rounded-bl-md'}">${esc(text)}</div>`;
  $('#chatMessages').appendChild(wrap);
  $('#chatMessages').scrollTop = $('#chatMessages').scrollHeight;
}

function botReply(faq) {
  const typing = document.createElement('div');
  typing.className = 'flex';
  typing.innerHTML = `<div class="bg-white border border-sand-200 rounded-2xl rounded-bl-md px-4 py-3 flex gap-1">
    <span class="dot w-1.5 h-1.5 rounded-full bg-sage-500"></span><span class="dot w-1.5 h-1.5 rounded-full bg-sage-500"></span><span class="dot w-1.5 h-1.5 rounded-full bg-sage-500"></span></div>`;
  $('#chatMessages').appendChild(typing);
  $('#chatMessages').scrollTop = $('#chatMessages').scrollHeight;
  setTimeout(() => {
    typing.remove();
    addMsg(faq ? L(faq.a) : t('chat_fallback'));
    if (faq?.action) faq.action();
  }, 650);
}

function matchFaq(text) {
  const q = text.toLowerCase();
  return FAQ.find(f => f.keys.some(k => q.includes(k)));
}

function resetChat() {
  $('#chatMessages').innerHTML = '';
  addMsg(t('chat_hello'));
  $('#chatChips').innerHTML = FAQ.filter(f => f.chip).map(f => `
    <button data-faq="${f.id}" class="text-xs px-3 py-1.5 rounded-full border border-sage-200 bg-sage-50 hover:bg-sage-100 text-sage-800 transition">${esc(L(f.chip))}</button>`).join('');
}

/* =========================================================
   6) EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lang],[data-pick],[data-sym],[data-th],[data-date],[data-time],[data-bk],[data-confirm],[data-faq]');
  if (!el) return;
  const d = el.dataset;

  if (d.lang) { state.lang = d.lang; renderAll(); }
  else if (d.pick) pickService(d.pick, !el.closest('#bookingForm'));
  else if (d.sym) { state.symptoms.has(d.sym) ? state.symptoms.delete(d.sym) : state.symptoms.add(d.sym); renderSymptoms(); renderSummary(); }
  else if (d.th) { state.therapist = d.th; renderTherapist(); renderDates(); renderSummary(); }
  else if (d.date) { state.date = d.date; renderDates(); renderSummary(); }
  else if (d.time) { state.time = d.time; renderSlots(); renderSummary(); }
  else if (d.bk) { state.selectedBooking = Number(d.bk); renderDashboard(); }
  else if (d.confirm) { const b = state.bookings.find(x => x.id === Number(d.confirm)); if (b) b.status = 'confirmed'; renderDashboard(); }
  else if (d.faq) { const f = FAQ.find(x => x.id === d.faq); addMsg(L(f.chip), 'user'); botReply(f); }
});

$('#pain').addEventListener('input', e => { state.pain = Number(e.target.value); $('#painVal').textContent = state.pain; });
$('#submitBtn').addEventListener('click', submitBooking);

$('#chatToggle').addEventListener('click', () => $('#chatPanel').classList.toggle('hidden'));
$('#chatClose').addEventListener('click', () => $('#chatPanel').classList.add('hidden'));
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('#chatInput').value.trim();
  if (!text) return;
  addMsg(text, 'user'); $('#chatInput').value = '';
  botReply(matchFaq(text));
});

$('#modalClose').addEventListener('click', () => $('#modal').classList.add('hidden'));
$('#modalDash').addEventListener('click', () => {
  $('#modal').classList.add('hidden');
  document.getElementById('dashboard').scrollIntoView({behavior:'smooth'});
});

/* =========================================================
   7) INIT
   ========================================================= */
seedBookings();
renderAll();
</script>
